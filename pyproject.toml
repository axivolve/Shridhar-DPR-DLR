[project]
name = "Shridhar-DPR-DLR"
version = "0.1.0"
description = "This project is a proof of concept for a chatbot that can answer questions about the Shridhar-DPR-DLR and updated DPR by voice command"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "agno>=1.8.2",
    "fastapi[standard]>=0.116.1",
    "google-api-python-client>=2.181.0",
    "google-auth>=2.40.3",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.2",
    "groq>=0.31.1",
    "httpx>=0.28.1",
    "mcp>=1.13.1",
    "pydantic>=2.11.7",
    "python-dotenv>=1.1.1",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.20",
    "supabase>=2.18.1",
    "uvicorn>=0.35.0",
]
